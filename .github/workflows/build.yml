name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Sam Altman Essays" --notes "Curated essays from blog.samaltman.com. Rebuilt automatically."
          gh release upload latest dist/altman.epub --clobber
      - name: Flag new posts
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python check_new.py
