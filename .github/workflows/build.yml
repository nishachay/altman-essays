name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35 libpango-1.0-0 libpangoft2-1.0-0
      - name: Install pandoc 3.1.11.1 (same version the book was checked with)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo dpkg -i pandoc-3.1.11.1-1-amd64.deb
      - run: pip install -r requirements.txt
      - run: python make_cover.py
      - run: python build.py
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Sam Altman: The Essays" --notes "EPUB for phones and e-readers, PDF for laptops and print, Markdown for plain text. Rebuilt automatically when the list changes."
          gh release upload latest dist/altman.epub dist/altman.pdf dist/altman-markdown.zip cover.jpg --clobber
      - name: Flag new posts
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python check_new.py
